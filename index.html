<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pancake Date? 🥞</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fff0f5;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .cat-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            border: 4px solid white;
        }

        h1 {
            color: #d63384;
            margin-bottom: 30px;
            font-size: 1.8rem;
            padding: 0 20px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            margin: 5px;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #yesBtn:hover {
            background-color: #e63956;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #ced4da;
            color: #495057;
            position: relative;
        }

        .time-btn {
            background-color: #ff758c;
            color: white;
        }

        .time-btn:hover {
            background-color: #ff5273;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div id="content" style="display: flex; flex-direction: column; align-items: center;">
        <img src="cat.jpg" alt="Cute Cat" class="cat-img">
        <h1 id="question">Do you want to go get pancakes Saturday and then hang out? 🥞✨</h1>
        
        <div class="buttons" id="buttonContainer">
            <button id="yesBtn" onclick="showTimePicker()">Yes! 🥰</button>
            <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No 😢</button>
        </div>
    </div>

    <script>
        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const maxX = window.innerWidth - noBtn.offsetWidth - 50;
            const maxY = window.innerHeight - noBtn.offsetHeight - 50;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function showTimePicker() {
            document.getElementById('question').innerText = "Yay! What time works best? ⏰🥞";
            
            const btnContainer = document.getElementById('buttonContainer');
            btnContainer.innerHTML = `
                <button class="time-btn" onclick="selectTime('5:30 PM')">5:30 PM 🥞</button>
                <button class="time-btn" onclick="selectTime('6:00 PM')">6:00 PM 🥞</button>
                <button class="time-btn" onclick="selectTime('6:30 PM')">6:30 PM 🥞</button>
            `;
        }

        function selectTime(time) {
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    access_key: "YOUR_ACCESS_KEY_HERE", // <-- Paste your Web3Forms key here
                    subject: "Pancake Date Confirmed! 🥞",
                    message: `They said yes and picked ${time}!`
                })
            });

            document.getElementById('content').innerHTML = `
                <img src="cat.jpg" alt="Cute Cat" class="cat-img">
                <h1 style="color: #ff4d6d; font-size: 2.1rem;">Yay! See you Saturday at ${time} for pancakes! 🥞💛✨</h1>
            `;
        }
    </script>

</body>
</html>
